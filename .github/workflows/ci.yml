name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser flows
        run: pnpm test:e2e

      - name: Build Windows portable files
        run: node scripts/package-windows.mjs

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: wifi-control-windows
          path: release/wifi-control-windows
          if-no-files-found: error
